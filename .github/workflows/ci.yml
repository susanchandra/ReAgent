name: ReAgent Release Verification & Docker Build CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    name: Verification Gate Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Release Gates
        run: |
          python launch_demo.py --check

      - name: Run Deployment Tests
        run: |
          python -m unittest deploy/hf_space/tests/test_public_deployment.py -v

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally (no push)
        run: |
          docker build -t reagent-space:local -f deploy/hf_space/Dockerfile .

      - name: Test container startup & health check
        run: |
          docker run -d --name reagent-test -p 7860:7860 reagent-space:local
          sleep 3
          curl -f http://127.0.0.1:7860/api/health
          curl -f -X POST http://127.0.0.1:7860/api/nemotron_propose
          docker stop reagent-test
